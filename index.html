<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/svg+xml" href="static/logo.svg">
<meta charset="utf-8">
<title>ImageL</title>
<meta name="theme-color" content="#0f1114">

<link rel="dns-prefetch" href="https://cjrtnc.leaningtech.com">
<!-- Google tag (gtag.js): carregado apos o load e respeitando Do Not Track, para nao competir com o boot -->
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  window.addEventListener('load', function () {
    if (navigator.doNotTrack === '1') return;
    var go = function () {
      var s = document.createElement('script');
      s.async = true;
      s.src = 'https://www.googletagmanager.com/gtag/js?id=G-WH7GT4NC11';
      document.head.appendChild(s);
      gtag('js', new Date());
      gtag('config', 'G-WH7GT4NC11');
    };
    (window.requestIdleCallback || function (f) { setTimeout(f, 2000); })(go);
  });
</script>
<!-- threadhack drop-in CheerpJ loader: auto worker pool + bytecode rewriter -->
<script src="threadhack/runtime/loader.js"></script>
<!-- ImageL: i18n + tratamento global de erros -->
<script type="module" src="src/boot-early.js"></script>
<!-- Tailwind compilado localmente (npm run build:css); substitui cdn.tailwindcss.com -->
<link rel="stylesheet" href="static/tailwind.css">
<link rel="stylesheet" href="static/theme.css?v=0.6.0-alpha.30">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">

<style>
    /* Modo leve: sem transicoes, animacoes, sombras e blur (maquinas modestas) */
    html[data-lite] *,html[data-lite] *::before,html[data-lite] *::after{transition:none!important;animation:none!important;backdrop-filter:none!important;text-shadow:none!important}
    html[data-lite] div.cjBordered{box-shadow:none!important}

    /* Splash de carregamento (ImageL) */
    #imagel-splash{position:fixed;inset:0;z-index:99999;display:grid;place-items:center;background:#0f1114;color:#e9edf1;font:14px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;transition:opacity .35s}
    #imagel-splash.done{opacity:0;pointer-events:none}
    #imagel-splash.failed{background:rgba(15,17,20,.82)}
    #imagel-splash .card{width:min(320px,80vw);text-align:center}
    #imagel-splash .logo{display:flex;align-items:center;justify-content:center;gap:10px;font-size:22px;font-weight:700;margin-bottom:18px}
    #imagel-splash .logo i{width:26px;height:26px;border-radius:7px;background:#5b92ff;display:inline-block}
    #imagel-splash .track{height:6px;border-radius:3px;background:#222830;overflow:hidden}
    #imagel-splash #imagel-splash-bar{height:100%;width:3%;background:#5b92ff;border-radius:3px;transition:width .4s ease}
    #imagel-splash.failed #imagel-splash-bar{background:#f0616d}
    #imagel-splash #imagel-splash-label{margin-top:12px;color:#97a3b0;font-size:13px;min-height:1.4em;word-break:break-word}
    @media (prefers-reduced-motion:reduce){#imagel-splash,#imagel-splash #imagel-splash-bar{transition:none}}
    html,
    body {
      margin: 0;
    }

    #container {
      width: 100vw;
      height: 100svh;
    }

    .cheerpjNC:before {
      content: "" !important;
    }

    /* Tooltip styles */
    .tooltip-wrapper {
      position: relative;
    }

    .tooltip {
      position: absolute;
      bottom: 100%;
      left: 0;
      transform: translateY(-8px);
      background: rgba(0, 0, 0, 0.9);
      color: white;
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      line-height: 1.4;
      white-space: normal;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 1000;
      min-width: 280px;
      max-width: 400px;
      text-align: center;
    }

    .tooltip::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 2rem;
      border: 6px solid transparent;
      border-top-color: rgba(0, 0, 0, 0.9);
    }

    .tooltip-wrapper:hover .tooltip {
      opacity: 1;
    }

    /* Disabled button styles */
    button:disabled {
      cursor: not-allowed !important;
      opacity: 0.5;
    }

    button:disabled:hover {
      transform: none !important;
    }

    /* Mobile responsive styles */
    @media (max-width: 640px) {
      /* Stack buttons vertically on mobile */
      .button-panel {
        flex-direction: column;
        left: 0.5rem !important;
        bottom: 0.5rem !important;
        right: 0.5rem;
        gap: 0.5rem !important;
      }

      .button-panel button {
        width: 100%;
        justify-content: center;
        font-size: 0.875rem;
        padding: 0.5rem 0.75rem !important;
      }

      .button-panel .tooltip-wrapper {
        width: 100%;
      }

      /* Adjust tooltip for mobile */
      .tooltip {
        min-width: 200px;
        max-width: 280px;
        font-size: 0.75rem;
        padding: 0.5rem 0.75rem;
      }

      /* Make button text truncate more aggressively on mobile */
      .button-panel button span {
        max-width: 150px !important;
      }
    }

    /* Very small screens */
    @media (max-width: 380px) {
      .button-panel button {
        font-size: 0.75rem;
        padding: 0.4rem 0.6rem !important;
      }

      .button-panel button svg {
        width: 1rem;
        height: 1rem;
      }

      .button-panel button span {
        max-width: 120px !important;
      }
    }

    /*
     * CheerpJ workaround: restore native-looking borders on TextField /
     * number-field inputs inside ImageJ dialogs. CheerpJ's AWT peer emits
     * <input> elements with no border styling, which makes dialog fields
     * look like bare text labels.
     *
     * This scopes strictly to inputs inside .cjWindow so it doesn't touch
     * any of the surrounding app chrome.
     */
    .cjWindow input:not([type="checkbox"]):not([type="radio"]):not([type="button"]) {
      border: 1px solid #9ca3af !important;
      border-radius: 2px !important;
      box-sizing: border-box !important;
      padding: 1px 3px !important;
      background: #ffffff !important;
    }

    .cjWindow input:not([type="checkbox"]):not([type="radio"]):not([type="button"]):focus {
      outline: none !important;
      border-color: #3b82f6 !important;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.25) !important;
    }

    /*
     * CheerpJ workaround: many dialog content wrappers use
     * overflow:hidden inline, which clips Choice (drop-down) popups so
     * they appear to "not work". We cannot target dialog wrappers by
     * class (they use inline styles), so we target any position:absolute
     * overflow:hidden div inside a cjWindow that's a direct child of the
     * dialog root. Popups are late-added children and need to escape.
     *
     * This is a best-effort fix; if a specific dialog breaks with this,
     * that dialog can be excluded by class.
     */
    .cjWindow > div[style*="overflow: hidden"][style*="width: 100%"][style*="height: 100%"] {
      overflow: visible !important;
    }

    /*
     * CheerpJ may render java.awt.Choice as a native <select>; give it
     * a visible border so it matches the TextField styling above.
     */
    .cjWindow select {
      border: 1px solid #9ca3af !important;
      border-radius: 2px !important;
      box-sizing: border-box !important;
      background: #ffffff !important;
    }

    /* Mobile styles for status indicators */
    @media (max-width: 640px) {
      /* Adjust top status indicators for mobile */
      #localFilesStatus {
        font-size: 0.75rem;
        padding: 0.4rem 0.6rem !important;
        top: 0.5rem !important;
        right: 0.5rem !important;
        left: 0.5rem !important;
        max-width: calc(100vw - 1rem);
      }

      /* Hypha status above button panel on mobile */
      #hyphaStatus {
        font-size: 0.75rem;
        padding: 0.4rem 0.6rem !important;
        left: 0.5rem !important;
        bottom: 11rem !important; /* Adjust for stacked buttons on mobile */
        max-width: calc(100vw - 1rem);
      }

      /* Test button at bottom-right */
      .fixed.bottom-4.right-4 button {
        font-size: 0.75rem;
        padding: 0.5rem 0.75rem !important;
        bottom: 0.5rem !important;
        right: 0.5rem !important;
      }

      /* Drag and drop overlay text */
      .drop-message {
        font-size: 1.5rem !important;
        padding: 1rem !important;
      }
    }
  </style>
</head>

<body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><filter id="il-dark" color-interpolation-filters="sRGB"><feComponentTransfer><feFuncR type="table" tableValues="0.914 0.70 0.50 0.34 0.133 0.090"/><feFuncG type="table" tableValues="0.929 0.72 0.52 0.36 0.157 0.102"/><feFuncB type="table" tableValues="0.945 0.74 0.54 0.38 0.188 0.122"/></feComponentTransfer></filter></svg>
<div id="imagel-splash" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="3" aria-live="polite">
  <div class="card">
    <div class="logo"><svg viewBox="0 0 64 64" width="28" height="28" aria-hidden="true"><defs><radialGradient id="ilg" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity=".22"/></radialGradient></defs><rect width="64" height="64" rx="14" fill="#5b92ff"/><g fill="url(#ilg)" stroke="#fff" stroke-width="2.4"><circle cx="20" cy="21" r="10"/><circle cx="44" cy="25" r="9"/><circle cx="31" cy="45" r="11"/></g><g fill="#2f56b8" fill-opacity=".85"><circle cx="22" cy="19" r="3.6"/><circle cx="45" cy="24" r="3.2"/><circle cx="32" cy="44" r="4"/></g></svg>ImageL</div>
    <div class="track"><div id="imagel-splash-bar"></div></div>
    <div id="imagel-splash-label">Loading…</div>
  </div>
</div>

<!--
  Floating control buttons have been folded into ImageJ's "Extensions" menu
  via com.hack.menu.MenuRegistry. Only status indicators remain down here.
  The Copy-MCP-URL button stays because it appears only when Hypha is
  connected and is useful as a quick-access clipboard shortcut.
-->
<div class="button-panel fixed bottom-4 left-4 z-50 flex gap-2">
  <button id="copyMcpBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-lg shadow-lg transition-colors duration-200 flex items-center space-x-2 hidden relative">
    <div class="absolute -top-1 -right-1 w-3 h-3 bg-green-400 rounded-full border-2 border-white"></div>
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
    </svg>
    <span>Copy MCP URL</span>
  </button>
</div>

<!-- Drag and drop overlay -->
<div id="dropOverlay">
  <div class="drop-message">
    📁 Drop files or folders here
  </div>
</div>

<!-- Local files status -->
<div id="localFilesStatus" class="fixed top-4 right-4 z-50 bg-purple-600 text-white px-3 py-2 rounded-md shadow-lg hidden">
  <div class="text-sm font-bold">Local Files (/local)</div>
  <div id="localFilesList" class="text-xs mt-1"></div>
</div>

<!-- Hypha connection status - positioned above buttons -->
<div id="hyphaStatus" class="fixed bottom-28 left-4 z-50 bg-gray-800 text-white px-3 py-2 rounded-md shadow-lg hidden">
  <div class="flex items-center space-x-2">
    <div id="hyphaStatusDot" class="w-2 h-2 rounded-full bg-gray-400"></div>
    <div class="text-sm font-bold" id="hyphaStatusText">Disconnected</div>
  </div>
  <div id="hyphaServiceUrl" class="text-xs mt-1 hidden"></div>
</div>

<!-- Load utilities -->
<script src="utils.js"></script>
<script src="file-browser.js"></script>

<!-- Load Hypha service -->
<script type="module" src="hypha-imagej-service.js"></script>

<script type="module" src="src/boot.js"></script>

<!-- OME-TIFF / OME-Zarr URL loader. Activated by ?load=<url>. -->
<!-- ome-loader, touch-controller e Cellpose agora sao carregados sob demanda (src/lazy.js). -->

<div id="container"></div>
</body>
</html>
