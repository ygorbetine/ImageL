format_version: 0.3.0
name: Small Extracellular Vesicle TEM Segmentation (Fully Residual U-Net)
description: Segmentation of small extracellular vesicles (sEV) in transmission electron microscopy images with a Fully Residual U-Net.
date: 2019
cite:
  - text: Gomez-de-Mariscal E. et al. Deep-Learning-Based Segmentation of Small Extracellular Vesicles in Transmission Electron Microscopy Images. Scientific Reports (2019)
    doi: 10.1038/s41598-019-49431-3
authors:
  - Estibaliz Gomez-de-Mariscal
  - Martin Maska
  - Anna Kotrbova
  - Vendula Pospichalova
  - Pavel Matula
  - Arrate Munoz-Barrutia
documentation: https://bioimage.io/#/?id=naked-microbe
covers: []
tags:
  - unet
  - deepimagej
  - segmentation
  - electron-microscopy
license: BSD-3-Clause
language: Java
framework: Tensorflow
git_repo: https://github.com/deepimagej/models
weights:
  tensorflow_js:
    name: v1
    format: layers-model
    source: model.json
    sha256: converted-from-5122cbff7451136102eabfc8c80771dbba5ec477d5dac186f729cdfbb4605ff6
inputs:
  - name: input
    axes: byxc
    data_type: float32
    data_range: [-inf, inf]
    shape:
      min: [1, 400, 400, 1]
      step: [0, 16, 16, 0]
outputs:
  - name: output
    axes: byxc
    data_type: float32
    data_range: [0, 1]
    halo: [0, 127, 127, 0]
    shape:
      reference_input: input
      scale: [1, 1, 1, 1]
      offset: [0, 0, 0, 0]
config:
  deepimagej:
    pyramidal_model: false
    allow_tiling: true
    model_keys:
      model_tag: tf.saved_model.tag_constants.SERVING
      signature_definition: tf.saved_model.signature_constants.DEFAULT_SERVING_SIGNATURE_DEF_KEY
    test_information:
      inputs:
        - name: exampleImage.tiff
          size: 400 x 400 x 1 x 1
          pixel_size:
            x: 1.5646 nm
            y: 1.5646 nm
            z: 1.0 pixel
      outputs:
        - name: resultImage.tiff
          type: image
          size: 400 x 400 x 1 x 1
      memory_peak: 250 Mb
      runtime: 1 s
    prediction:
      preprocess:
      -   spec: ij.IJ::runMacroFile
          kwargs: preprocessing.txt
      postprocess:
      -   spec: ij.IJ::runMacroFile
          kwargs: postprocessing.txt
